<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конфигурация сборки</title>
  <style>
    {{ font_css | safe }}
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f1117;
      color: #f1f5f9;
      font-family: 'Google Sans', Arial, sans-serif;
      font-size: 11px;
      min-height: 100vh;
      display: block;
      padding: 20px;
    }

    .page {
      width: 100%;
      max-width: 720px;
      background: #0f1117;
      border: 1px solid #1e2a3a;
      border-radius: 8px;
      overflow: hidden;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      background: #1a2030;
      border-bottom: 1px solid #1e2a3a;
      padding: 14px 24px;
      display: table;
      width: 100%;
    }
    
    .header-left { 
      display: table-cell;
      width: 50%;
      vertical-align: top;
    }
    
    .header-eyebrow {
      font-size: 9px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #60a5fa;
      margin-bottom: 4px;
    }
    
    .header h1 {
      font-size: 18px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #f1f5f9;
      line-height: 1;
    }
    
    .header-right { 
      display: table-cell;
      text-align: right;
      width: 50%;
      vertical-align: top;
    }
    
    .header-tdp-label {
      font-size: 8px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #60a5fa;
      margin-bottom: 2px;
    }
    
    .header-tdp-val {
      font-size: 20px;
      font-weight: bold;
      color: #f1f5f9;
      line-height: 1;
    }
    
    .header-tdp-unit { 
      font-size: 11px; 
      color: #60a5fa; 
      font-weight: bold; 
    }
    
    .header-tdp-sub { 
      font-size: 8px; 
      color: #334155; 
      margin-top: 2px; 
    }

    /* ── CARDS ── */
    .container { 
      padding: 12px; 
      display: block;
    }

    .card {
      background: #161b27;
      border: 1px solid #1e2a3a;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .card-header {
      background: #1a2030;
      border-bottom: 1px solid #1e2a3a;
      padding: 10px 12px;
      display: table;
      width: 100%;
    }
    
    .card-header-left { 
      display: table-cell;
      width: 70%;
      vertical-align: top;
    }
    
    .card-type {
      font-size: 7px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #60a5fa;
      margin-bottom: 2px;
    }
    
    .card-name { 
      font-size: 12px; 
      font-weight: bold; 
      color: #f1f5f9; 
    }

    .card-tdp { 
      display: table-cell;
      text-align: right;
      width: 30%;
      vertical-align: top;
      padding-left: 10px;
    }
    
    .card-tdp-num { 
      font-size: 15px; 
      font-weight: bold; 
      color: #f1f5f9; 
      line-height: 1; 
    }
    
    .card-tdp-unit { 
      font-size: 8px; 
      color: #60a5fa; 
      font-weight: bold; 
    }
    
    .card-tdp-lbl { 
      font-size: 6px; 
      color: #4b6070; 
      letter-spacing: 0.5px; 
      text-transform: uppercase; 
      margin-top: 1px; 
    }

    /* ── SPECS GRID ── */
    .specs {
      padding: 8px 10px;
      display: table;
      width: 100%;
      table-layout: fixed;
    }
    
    .specs-row {
      display: table-row;
    }
    
    .spec {
      display: table-cell;
      background: #0b0d13;
      border: 1px solid #1e2a3a;
      border-radius: 3px;
      padding: 6px 8px;
      margin: 2px;
      width: 33%;
      vertical-align: top;
    }
    
    .spec-k {
      font-size: 6px;
      color: #4b6070;
      letter-spacing: 0px;
      text-transform: uppercase;
      display: block;
      margin-bottom: 2px;
      font-weight: bold;
    }
    
    .spec-v {
      font-size: 9px;
      font-weight: bold;
      color: #cbd5e1;
      display: block;
      line-height: 1.2;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
<div class="page">
  <div class="header">
    <div class="header-left">
      <div class="header-eyebrow">Системная сборка</div>
      <h1>КОНФИГУРАЦИЯ</h1>
    </div>
    <div class="header-right">
      <div class="header-tdp-label">Суммарное потребление</div>
      <div><span class="header-tdp-val">{{ total_tdp }}</span><span class="header-tdp-unit"> W</span></div>
      <div class="header-tdp-sub">{{ components_count }} компонент</div>
    </div>
  </div>
  <div class="container">
    {{ components_html | safe }}
  </div>
</div>
</body>
</html>
